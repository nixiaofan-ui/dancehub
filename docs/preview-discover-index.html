<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>发现页 · 首字母索引预览</title>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex; align-items: center; justify-content: center; gap: 40px;
    background: #f0f2f7;
    font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
  }
  .note { max-width: 320px; color: #3a3f52; font-size: 14px; line-height: 1.9; }
  .note h1 { font-size: 18px; margin: 0 0 12px; }
  .note code { background: #e3e6ef; padding: 1px 5px; border-radius: 4px; font-size: 12px; }
  .note li { margin-bottom: 6px; }

  .phone {
    position: relative;
    width: 375px; height: 812px;
    background: #1a1a2e;
    border-radius: 44px;
    overflow: hidden;
    box-shadow: 0 24px 70px rgba(20, 24, 50, .35);
    color: #fff;
  }
  /* 状态栏 + 自定义导航栏 */
  .statusbar { height: 47px; }
  .nav {
    display: flex; align-items: center; height: 44px; padding: 0 12px;
    border-bottom: 3px solid #ff6b35;
  }
  .nav-tag { width: 8px; height: 20px; background: #ff6b35; border-radius: 2px; margin-right: 7px; }
  .nav-logo { font-size: 17px; font-weight: 700; letter-spacing: 1px; }

  .scroll { height: calc(100% - 94px); overflow-y: auto; padding: 10px 12px 40px; }
  .scroll::-webkit-scrollbar { width: 0; }

  .seg-row { display: flex; justify-content: center; margin-bottom: 9px; }
  .seg {
    display: flex; background: rgba(26,26,46,.7);
    border: 1px solid rgba(255,255,255,.08); border-radius: 20px; padding: 3px;
  }
  .seg-item { padding: 5px 24px; border-radius: 18px; font-size: 14px; color: #aaa; font-weight: 700; }
  .seg-item.on { background: linear-gradient(135deg,#ff6b35,#ff8a5c); color: #fff; font-weight: 900; }

  .city-bar { display: flex; gap: 8px; margin-bottom: 8px; overflow-x: auto; }
  .city-bar::-webkit-scrollbar { height: 0; }
  .chip {
    flex-shrink: 0; padding: 5px 16px; background: #16213e; border-radius: 16px;
    font-size: 13px; color: #aaa; border: 1px solid rgba(255,255,255,.08); font-weight: 700;
  }
  .chip.on { background: linear-gradient(135deg,#7b2fbe,#9b5cff); color: #fff; border-color: #7b2fbe; font-weight: 900; }

  .search-box {
    display: flex; align-items: center; background: #16213e;
    border: 1px solid rgba(255,255,255,.06); border-radius: 24px;
    padding: 6px 6px 6px 14px; margin-bottom: 10px; box-shadow: 0 4px 20px rgba(0,0,0,.3);
  }
  .search-input { flex: 1; font-size: 14px; color: #6f7590; border: 0; background: none; outline: none; }
  .search-btn {
    background: linear-gradient(135deg,#ff6b35,#ff8a5c); color: #fff;
    border-radius: 20px; padding: 6px 14px; font-size: 13px; font-weight: 900;
  }

  /* 吸顶分组标题 */
  .sec-head {
    position: sticky; top: 0; z-index: 5;
    display: flex; align-items: baseline; height: 26px; margin-bottom: 5px;
    background: #1a1a2e; font-size: 13px; font-weight: 900; color: #00f5d4; letter-spacing: 1px;
  }
  .sec-count { margin-left: 5px; font-size: 10px; color: #6f7590; letter-spacing: 0; }

  .card {
    display: flex; align-items: center; background: #16213e; border-radius: 8px;
    padding: 10px; margin: 0 12px 8px 0;
    border: 1px solid rgba(255,255,255,.05); box-shadow: 0 4px 20px rgba(0,0,0,.3);
  }
  .avatar {
    width: 44px; height: 44px; border-radius: 12px; flex-shrink: 0;
    background: linear-gradient(135deg,#7b2fbe,#9b5cff); color: #fff;
    font-size: 17px; font-weight: 900;
    display: flex; align-items: center; justify-content: center;
  }
  .info { flex: 1; margin: 0 8px; min-width: 0; }
  .name { font-size: 16px; font-weight: 900; letter-spacing: .5px; }
  .addr { font-size: 12px; color: #aaa; margin-top: 3px; font-weight: 700;
          overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .tags { display: flex; flex-wrap: wrap; margin-top: 5px; }
  .tag {
    font-size: 11px; font-weight: 900; color: #00f5d4; background: rgba(0,245,212,.12);
    border: 1px solid rgba(0,245,212,.35); border-radius: 4px;
    padding: 1px 6px; line-height: 1.6; margin: 0 4px 3px 0;
  }
  .arrow { width: 20px; margin-right: 6px; color: #ff6b35; font-size: 20px; font-weight: 900; flex-shrink: 0; }
  .follow {
    font-size: 13px; color: #00f5d4; background: transparent;
    border: 1px solid #00f5d4; border-radius: 16px; padding: 4px 14px;
    font-weight: 900; flex-shrink: 0; cursor: pointer;
  }
  .follow.on { color: #0e0e1c; background: #00f5d4; }

  /* 右侧字母索引条 */
  .index-bar {
    position: absolute; right: 1px; top: 50%; transform: translateY(-50%);
    z-index: 20; display: flex; flex-direction: column; align-items: center;
    padding: 0 2px; background: rgba(22,33,62,.9);
    border: 1px solid rgba(255,255,255,.08); border-radius: 15px;
    box-shadow: 0 4px 16px rgba(0,0,0,.35);
    touch-action: none; user-select: none;
  }
  .index-item {
    width: 17px; height: 15px; line-height: 15px; text-align: center;
    font-size: 10px; font-weight: 900; color: #8b90a8;
  }
  .index-item.on { color: #00f5d4; transform: scale(1.3); }

  .index-tip {
    position: absolute; left: 50%; top: 50%;
    width: 75px; height: 75px; margin: -37.5px 0 0 -37.5px;
    z-index: 30; display: none; align-items: center; justify-content: center;
    border-radius: 16px; background: rgba(0,245,212,.94); color: #0e0e1c;
    font-size: 36px; font-weight: 900; box-shadow: 0 8px 24px rgba(0,0,0,.5);
  }
  .index-tip.show { display: flex; }
</style>
</head>

const OTHER = "#";
const cmp = (a, b) => a === b ? 0 : a === OTHER ? 1 : b === OTHER ? -1 : (a < b ? -1 : 1);

// 保序分组（与服务端排序结果配合）
const bucket = new Map();
for (const s of DATA) {
  if (!bucket.has(s.initial)) bucket.set(s.initial, []);
  bucket.get(s.initial).push(s);
}
const letters = [...bucket.keys()].sort(cmp);

const list = document.getElementById("list");
list.innerHTML = letters.map((L) =>
  `<div class="sec-head" id="sec-${L === OTHER ? "SHARP" : L}">${L}<span class="sec-count">${bucket.get(L).length}</span></div>` +
  bucket.get(L).map((s) => `
    <div class="card">
      <div class="avatar">${s.name.charAt(0)}</div>
      <div class="info">
        <div class="name">${s.name}</div>
        ${s.address ? `<div class="addr">${s.address}</div>` : ""}
        ${s.styles.length ? `<div class="tags">${s.styles.map((t) => `<div class="tag">${t}</div>`).join("")}</div>` : ""}
      </div>
      <div class="arrow">›</div>
      <div class="follow">关注</div>
    </div>`).join("")
).join("");
document.getElementById("cnt").textContent = DATA.length;

// 索引条
const bar = document.getElementById("bar");
const tip = document.getElementById("tip");
const scroll = document.getElementById("scroll");
bar.innerHTML = letters.map((L) => `<div class="index-item">${L}</div>`).join("");
const items = [...bar.querySelectorAll(".index-item")];

let active = null;
function jumpAt(clientY) {
  const r = bar.getBoundingClientRect();
  const step = r.height / letters.length;
  const i = Math.max(0, Math.min(letters.length - 1, Math.floor((clientY - r.top) / step)));
  const L = letters[i];
  if (L === active) return;
  active = L;
  items.forEach((el, k) => el.classList.toggle("on", k === i));
  tip.textContent = L;
  tip.classList.add("show");
  const target = document.getElementById("sec-" + (L === OTHER ? "SHARP" : L));
  if (target) scroll.scrollTop = target.offsetTop - scroll.offsetTop;
}
function end() {
  active = null;
  tip.classList.remove("show");
  items.forEach((el) => el.classList.remove("on"));
}

let dragging = false;
bar.addEventListener("pointerdown", (e) => { dragging = true; bar.setPointerCapture(e.pointerId); jumpAt(e.clientY); });
bar.addEventListener("pointermove", (e) => { if (dragging) jumpAt(e.clientY); });
bar.addEventListener("pointerup", end);
bar.addEventListener("pointercancel", end);

// 手动滚动时清掉高亮
scroll.addEventListener("scroll", () => { if (!dragging && active) end(); });
</script>
